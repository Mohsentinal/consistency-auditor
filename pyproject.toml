[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "consistency-auditor"
version = "0.2.1"
description = "Audit backtest vs live trading consistency with CSV matching, event-log replay, and CLI reports."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mohsen Moghaddam"}]
keywords = ["trading", "backtesting", "audit", "cli", "quant"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
snapshot = ["pandas>=2.0", "pyarrow>=14.0"]
dev = ["pytest>=8", "ruff>=0.12", "build>=1.2", "twine>=6", "pandas>=2.0", "pyarrow>=14.0"]

[project.urls]
Homepage = "https://github.com/Mohsentinal/consistency-auditor"
Repository = "https://github.com/Mohsentinal/consistency-auditor"
Issues = "https://github.com/Mohsentinal/consistency-auditor/issues"
Changelog = "https://github.com/Mohsentinal/consistency-auditor/blob/main/CHANGELOG.md"

[project.scripts]
consistency-auditor = "consistency_auditor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
